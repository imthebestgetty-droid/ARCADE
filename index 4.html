<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Neon Game Hub</title><style>body{margin:0;background:#080b14;color:#fff;font:16px Arial}.wrap{max-width:1050px;width:92%;margin:auto}header{text-align:center;padding:55px 0 30px}h1{font-size:clamp(40px,8vw,80px);background:linear-gradient(90deg,#55d6ff,#ff4fd8,#7dff9b);color:transparent;background-clip:text}.bar{display:flex;gap:10px;flex-wrap:wrap;background:#12182acc;padding:16px;border:1px solid #293555;border-radius:16px;position:sticky;top:10px}input,.filter{padding:13px;border-radius:10px;border:1px solid #293555;background:#11182a;color:#fff}input{flex:1;min-width:210px}.filter{cursor:pointer}.active,.filter:hover{background:#3d2053;border-color:#ff4fd8}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;padding:28px 0}.card{padding:22px;border:1px solid #293555;border-radius:18px;background:linear-gradient(145deg,#161e34,#0e1422);transition:.25s}.card:hover{transform:translateY(-8px);border-color:#55d6ff;box-shadow:0 0 28px #55d6ff33}.icon{font-size:42px}.muted{color:#9ca8c7;min-height:38px}.tag{color:#7dff9b;font-size:12px}button.play{width:100%;padding:12px;border:0;border-radius:9px;background:linear-gradient(90deg,#55d6ff,#7d7bff);font-weight:bold;cursor:pointer}#empty{display:none;text-align:center;color:#9ca8c7;padding:30px}footer{text-align:center;color:#697593;padding:25px}</style></head><body><main class="wrap"><header><div>WELCOME TO THE ARCADE</div><h1>NEON GAME HUB</h1><p class="muted">Search and filter all your games.</p></header><nav class="bar"><input id="q" placeholder="🔎 Search games..."><button class="filter active" data-c="All">All</button><button class="filter" data-c="Arcade">Arcade</button><button class="filter" data-c="Puzzle">Puzzle</button><button class="filter" data-c="Classic">Classic</button><button class="filter" data-c="Action">Action</button><button class="filter" data-c="Adventure">Adventure</button></nav><section class="grid" id="grid"></section><div id="empty">No games found.</div><footer>Play responsibly · GitHub Pages ready</footer></main><script>const games=[("⚡", "Clicker", "Arcade", "Click as fast as you can."), ("❌", "Tic-Tac-Toe", "Classic", "Challenge a friend."), ("🔢", "Guess the Number", "Puzzle", "Find the hidden number."), ("🐍", "Snake", "Arcade", "Grow longer and beat your score."), ("🧠", "Memory Match", "Puzzle", "Test your memory."), ("🏓", "Pong", "Classic", "Keep the ball in play."), ("🚀", "Space Runner", "Arcade", "Dodge obstacles in space."), ("🧩", "2048", "Puzzle", "Combine tiles to reach 2048."), ("🪂", "Fortnite", "Action", "Drop in, build, and battle for victory."), ("🎯", "1v1.LOL", "Action", "Build, aim, and battle in a fast 1v1 match."), ("🕵️", "Breaking the Bank", "Adventure", "Choose your plan and try to break into the bank."), ("🚔", "Escaping the Prison", "Adventure", "Make the right choices to escape."), ("💎", "Stealing the Diamond", "Adventure", "Attempt the ultimate diamond heist."), ("✈️", "Infiltrating the Airship", "Adventure", "Infiltrate the airship and choose your path."), ("🔓", "Fleeing the Complex", "Adventure", "Escape the complex with clever decisions."), ("🏁", "Completing the Mission", "Adventure", "Finish Henry Stickman’s final mission.")];let cat='All';const grid=document.querySelector('#grid'),q=document.querySelector('#q');function render(){let text=q.value.toLowerCase(),list=games.filter(g=>(cat==='All'||g[2]===cat)&&g[1].toLowerCase().includes(text));grid.innerHTML=list.map(g=>`<article class="card"><div class="icon">${g[0]}</div><p class="tag">${g[2]}</p><h2>${g[1]}</h2><p class="muted">${g[3]}</p><button class="play" onclick="alert('${g[1]} selected — add its authorized game link here.')">PLAY NOW →</button></article>`).join('');document.querySelector('#empty').style.display=list.length?'none':'block'}document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');cat=b.dataset.c;render()});q.oninput=render;render();</script></body></html>
