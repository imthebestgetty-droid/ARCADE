<!doctype html><meta name="viewport" content="width=device-width"><title>Game Hub</title><style>body{font:18px Arial;background:#10131b;color:white;text-align:center;padding:30px}.card{display:inline-block;background:#202737;padding:20px;margin:10px;border-radius:14px}button{padding:12px;background:#708bff;color:white;border:0;border-radius:8px}#screen{margin:20px auto;padding:25px;max-width:500px;background:#191e29;border-radius:15px}</style><h1>🎮 Game Hub</h1><p>Choose a game</p><div class="card">⚡ Clicker<br><button onclick="clicker()">Play</button></div><div class="card">❌ Tic-Tac-Toe<br><button onclick="tic()">Play</button></div><div class="card">🔢 Guess Number<br><button onclick="guess()">Play</button></div><div class="card">🐍 Snake<br><button onclick="snake()">Play</button></div><div id="screen">Select a game above.</div><script>let s=document.getElementById('screen');function clicker(){let n=0;s.innerHTML='<h2>Clicker</h2><h1 id="n">0</h1><button onclick="n++;document.getElementById('n').textContent=n">Click!</button>'}function tic(){let a=Array(9).fill(''),p='X';s.innerHTML='<h2>Tic-Tac-Toe</h2><div id="b"></div>';for(let i=0;i<9;i++){let x=document.createElement('button');x.style='width:70px;height:70px;margin:3px;font-size:25px';x.onclick=()=>{if(!a[i]){a[i]=p;x.textContent=p;p=p==='X'?'O':'X'}};b.append(x)}}function guess(){let n=Math.ceil(Math.random()*100);s.innerHTML='<h2>Guess the Number</h2><input id="g"><button onclick="r.textContent=+g.value===n?'Correct!':+g.value<n?'Too low':'Too high'">Guess</button><p id="r"></p>'}function snake(){s.innerHTML='<h2>Snake</h2><p>Use arrow keys. Snake game ready for expansion.</p><button onclick="location.reload()">Back</button>'}</script>
