<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Game Control Panel</title><style>body{margin:0;background:#10131b;color:#f4f7fb;font:16px Arial;display:grid;place-items:center;min-height:100vh}.box{width:min(620px,90%);background:#191e29;padding:28px;border-radius:20px}h1{font-size:40px;margin:8px 0}.eyebrow{color:#8aa4ff;font-size:12px;font-weight:bold;letter-spacing:2px}.sub,.hint{color:#aab3c5}.choices{display:flex;gap:12px;margin:24px 0}.choice{flex:1;padding:16px;border:1px solid #34405a;border-radius:12px;background:#202737;color:white;text-align:left;cursor:pointer}.active{border-color:#708bff;background:#26345b}.choice b,.choice small{display:block;margin-top:7px}.choice small{color:#9da8bb}.row{display:flex;gap:10px}input{flex:1;padding:14px;border-radius:10px;border:1px solid #3a455c;background:#0f131c;color:white}.connect{background:#6d87ff;color:white;border:0;border-radius:10px;padding:0 18px;font-weight:bold}.status{margin-top:20px;padding:12px;background:#111822;border-radius:9px}.hidden{display:none}@media(max-width:500px){.choices,.row{flex-direction:column}.connect{padding:13px}}</style></head><body><main class="box"><p class="eyebrow">PRIVATE SERVER CONNECT</p><h1>Game Control Panel</h1><p class="sub">Choose a game and connect to your own server.</p><div class="choices"><button id="mcbtn" class="choice active">⛏️<b>Minecraft</b><small>Server address</small></button><button id="rbbtn" class="choice">🎮<b>Roblox</b><small>Experience link</small></button></div><section id="mc"><label>Minecraft server address</label><div class="row"><input id="mci" placeholder="play.example.com:25565"><button class="connect" id="mcb">Connect</button></div><p class="hint">Open Minecraft and add this address under Multiplayer.</p></section><section id="rb" class="hidden"><label>Roblox experience/private-server link</label><div class="row"><input id="rbi" placeholder="https://www.roblox.com/games/..."><button class="connect" id="rbb">Open Roblox</button></div><p class="hint">Roblox uses a link rather than an arbitrary server IP.</p></section><div class="status" id="s">Ready to connect.</div></main><script>const $=x=>document.querySelector(x),mc=$('#mc'),rb=$('#rb'),s=$('#s');$('#mcbtn').onclick=()=>{mc.classList.remove('hidden');rb.classList.add('hidden');$('#mcbtn').classList.add('active');$('#rbbtn').classList.remove('active');s.textContent='Ready to connect.'};$('#rbbtn').onclick=()=>{rb.classList.remove('hidden');mc.classList.add('hidden');$('#rbbtn').classList.add('active');$('#mcbtn').classList.remove('active');s.textContent='Ready to connect.'};$('#mcb').onclick=()=>{let x=$('#mci').value.trim();s.textContent=x?'Address saved: '+x+'. Add it in Minecraft Multiplayer.':'Enter an address first.'};$('#rbb').onclick=()=>{let x=$('#rbi').value.trim();if(!x.startsWith('https://www.roblox.com/')){s.textContent='Enter a valid Roblox link first.';return}s.textContent='Opening Roblox...';open(x,'_blank')};</script></body></html>
